[project]
name = "wangluo-xuejing"
version = "0.1.0"
description = "中文计算机网络学习路径 — 主机可验证的教学仿真与实验"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
python_files = ["test_*.py"]
addopts = "-q"
